name: Build APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: noteloom-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps
      - name: Debug - check env & npm
        shell: bash
        run: |
          echo "EXPO_TOKEN length: ${#EXPO_TOKEN}"
          echo "Node: $(node -v)"
          echo "NPM: $(npm -v)"
          npm install -g eas-cli 2>&1
          echo "EAS CLI installed"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Debug - EAS whoami
        shell: bash
        run: 'eas whoami 2>&1; echo "exit code: $?"'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK
        shell: bash
        run: 'eas build -p android --profile preview --non-interactive --wait --output app-release.apk 2>&1'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: noteloom-mobile/app-release.apk
          generate_release_notes: true
