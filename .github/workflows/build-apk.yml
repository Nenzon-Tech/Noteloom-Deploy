name: Build APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eduspace-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps
      - name: Debug - check env & npm
        shell: bash
        run: |
          echo "EXPO_TOKEN length: ${#EXPO_TOKEN}"
          echo "Node: $(node -v)"
          echo "NPM: $(npm -v)"
          npm install -g eas-cli 2>&1
          echo "EAS CLI installed"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Debug - EAS whoami
        shell: bash
        run: 'eas whoami 2>&1; echo "exit code: $?"'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Init EAS project
        shell: bash
        run: 'eas init --account nenzon-technology --non-interactive --force 2>&1'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK
        shell: bash
        run: 'eas build -p android --profile preview --non-interactive --wait --json > build.json 2>build.log; cat build.log; echo "---"; cat build.json'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Download APK artifact
        shell: bash
        run: |
          URL=$(node -e "const d=JSON.parse(require('fs').readFileSync('build.json','utf8')); const b=Array.isArray(d)?d[0]:d; console.log(b.artifacts?.buildUrl ?? '')")
          if [ -z "$URL" ]; then echo "::error::No buildUrl in build.json"; cat build.json; exit 1; fi
          curl -fL -H "Authorization: Bearer $EXPO_TOKEN" "$URL" -o app-release.apk
          ls -la app-release.apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: eduspace-apk
          path: eduspace-mobile/app-release.apk
          if-no-files-found: error
      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: eduspace-mobile/app-release.apk
          generate_release_notes: true
