name: Build APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: noteloom-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps
      - name: Debug - check env & npm
        shell: bash
        run: |
          echo "EXPO_TOKEN length: ${#EXPO_TOKEN}"
          echo "Node: $(node -v)"
          echo "NPM: $(npm -v)"
          npm install -g eas-cli 2>&1
          echo "EAS CLI installed"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Debug - EAS whoami
        shell: bash
        run: 'eas whoami 2>&1; echo "exit code: $?"'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Init EAS project
        shell: bash
        run: 'eas init --account nenzon-technology --non-interactive --force 2>&1'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK
        shell: bash
        run: 'eas build -p android --profile preview --non-interactive --wait 2>&1'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Download APK artifact
        shell: bash
        run: |
          BUILDS=$(eas build:list --platform android --limit 1 --non-interactive --json 2>/dev/null)
          URL=$(node -e "const d=JSON.parse(process.argv[1]); const b=d.find(x=>x.status==='finished' && x.artifacts?.buildUrl); console.log(b?.artifacts?.buildUrl ?? '')" "$BUILDS")
          if [ -z "$URL" ]; then echo "::error::No finished build artifact found"; exit 1; fi
          curl -fL "$URL" -o app-release.apk
          ls -la app-release.apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app-release.apk
          generate_release_notes: true
