name: Build APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: noteloom-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps
      - name: Build APK via EAS
        run: |
          npx eas-cli whoami 2>&1 || echo "whoami failed"
          npx eas-cli build:list --json --limit=1 2>&1 || echo "build:list failed"
          npx eas-cli build -p android --profile preview --non-interactive --wait --output app-release.apk 2>&1
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: noteloom-mobile/app-release.apk
          generate_release_notes: true
